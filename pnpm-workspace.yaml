packages:
  - 'apps/*'
  - 'packages/*'

# Avoid pnpm's default release-age verification requests to npm's attestation API.
minimumReleaseAge: 0

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
