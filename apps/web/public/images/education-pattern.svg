<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="edu-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Books -->
      <path d="M10 20 L20 20 L20 35 L10 35 Z" fill="none" stroke="#C41E3A" stroke-width="0.5" opacity="0.1"/>
      <path d="M10 20 L15 25 L15 40 L10 35 Z" fill="none" stroke="#C41E3A" stroke-width="0.5" opacity="0.1"/>
      
      <!-- Graduation cap -->
      <path d="M50 10 L70 20 L50 30 L30 20 Z" fill="none" stroke="#C41E3A" stroke-width="0.5" opacity="0.08"/>
      <path d="M50 30 L50 45" stroke="#C41E3A" stroke-width="0.5" opacity="0.08"/>
      
      <!-- Globe circles -->
      <circle cx="80" cy="60" r="12" fill="none" stroke="#C41E3A" stroke-width="0.5" opacity="0.06"/>
      <circle cx="80" cy="60" r="8" fill="none" stroke="#C41E3A" stroke-width="0.5" opacity="0.06"/>
      
      <!-- Dots pattern -->
      <circle cx="20" cy="70" r="2" fill="#C41E3A" opacity="0.08"/>
      <circle cx="30" cy="80" r="2" fill="#C41E3A" opacity="0.08"/>
      <circle cx="40" cy="70" r="2" fill="#C41E3A" opacity="0.08"/>
      
      <!-- Lines -->
      <line x1="60" y1="80" x2="90" y2="80" stroke="#C41E3A" stroke-width="0.5" opacity="0.06"/>
      <line x1="60" y1="85" x2="85" y2="85" stroke="#C41E3A" stroke-width="0.5" opacity="0.06"/>
      
      <!-- Small squares -->
      <rect x="5" y="50" width="6" height="6" fill="none" stroke="#C41E3A" stroke-width="0.5" opacity="0.08"/>
      <rect x="70" y="40" width="6" height="6" fill="none" stroke="#C41E3A" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#edu-pattern)" />
</svg>
